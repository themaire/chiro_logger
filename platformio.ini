; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_c3_mini]
board = lolin_c3_mini
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_unflags = 
	-DCONFIG_ESPTOOLPY_FLASHSIZE_4MB
	-DCONFIG_ESPTOOLPY_FLASHSIZE_2MB
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ARDUHAL_LOG_COLORS=0
	
	; Optimisations mémoire pour ESP32-C3 + SD Card
	-DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
	-DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=240
	-DCONFIG_FREERTOS_UNICORE=1
	-DCONFIG_HEAP_ABORT_WHEN_ALLOCATION_FAILS=0
	-DCONFIG_ESP_SYSTEM_ALLOW_RTC_FAST_MEM_AS_HEAP=1
	-DCONFIG_ESP_TIMER_TASK_STACK_SIZE=3584
	-DCONFIG_LWIP_UDP_RECVMBOX_SIZE=6
	-DCONFIG_LWIP_TCP_RECVMBOX_SIZE=6

	; Configuration de la taille de la flash gérée par sdkconfig.defaults
	
	-DCONFIG_ESPTOOLPY_FLASHFREQ_40M=1
	-DCONFIG_ESPTOOLPY_FLASHMODE_DIO=1
	; Suppression maximale des logs pour la production
	-DCONFIG_ESP_CONSOLE_UART_NONE=1
	; LOG_LOCAL_LEVEL supprimé - géré par sdkconfig.defaults
	; Note: Configuration des logs système déplacée dans sdkconfig.defaults


; !!! La carte Lolin C3 Mini utilise un ESP32-C3.
board_build.mcu = esp32c3

board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L

; 4MB Flash pour la carte Lolin C3 Mini
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.flash_freq = 40m
upload_protocol = esptool
upload_port = /dev/cu.usbserial-*
